<main class="main">
  <div class="content">
    <h1>{{title()}}</h1>
    @if(store.status() === GameStatus.SOLVED) {
        <router-outlet />
    }

    @defer(on interaction; prefetch on hover) {
      <app-difficulty-selector (onChangeDifficulty)="sudokuBoard().loadNewGame()"/>
    } @placeholder {
      <button class="action">Select Difficulty</button>
    }
    
    <app-multiplayer/>
    <app-status/>
    <app-sudoku-board/>
  </div>
</main>
